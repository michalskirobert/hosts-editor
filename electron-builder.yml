appId: com.nurbyte.hostseditor
productName: Hosts Editor
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

toolsets:
  appimage: "1.0.3"

directories:
  buildResources: assets
  output: dist

files:
  - out/**/*
  - package.json

asar: true

publish:
  provider: github
  owner: michalskirobert
  repo: hosts-editor
  releaseType: release

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.icns
  sign:
    identity: null
    hardenedRuntime: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Utility