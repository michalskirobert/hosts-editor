<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: 440px;
        height: 340px;
        border-radius: 32px;
        background: linear-gradient(145deg, #101827, #060a11);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 30px 80px #0008;
        color: #fff;
      }
      .logo {
        width: 150px;
        height: 150px;
        object-fit: contain;
      }
      .name {
        font-size: 20px;
        font-weight: 700;
        margin-top: 12px;
      }
      .sub {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 5px;
      }
      .bar {
        width: 120px;
        height: 3px;
        background: #1e293b;
        border-radius: 10px;
        margin-top: 28px;
        overflow: hidden;
      }
      .bar:after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #22c55e;
        animation: a 1s infinite ease-in-out;
      }
      @keyframes a {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="hosts_editor.png" />
      <div class="name">Hosts Editor</div>
      <div class="sub">NurByte · starting securely</div>
      <div class="bar"></div>
    </div>
  </body>
</html>
