<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosts Editor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .card {
        width: 440px;
        height: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 32px;
        background: linear-gradient(145deg, #101827, #080d15);
        color: #f8fafc;
      }

      .logo {
        display: block;
        width: 150px;
        height: 150px;
        border-radius: 30px;
        object-fit: contain;
        -webkit-user-drag: none;
      }

      .name {
        margin: 14px 0 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.4px;
      }

      .sub {
        margin: 6px 0 0;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.5;
      }

      .bar {
        width: 120px;
        height: 3px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 999px;
        background: #1e293b;
      }

      .bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #fbbf24;
        animation: loading 1.2s ease-in-out infinite;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }

        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          width: 100%;
          animation: none;
          opacity: 0.75;
        }
      }
    </style>
  </head>

  <body>
    <main class="card" role="status" aria-label="Starting Hosts Editor">
      <img
        class="logo"
        src="./src/assets/hosts_editor.png"
        width="150"
        height="150"
        alt=""
        draggable="false"
      />

      <h1 class="name">Hosts Editor</h1>
      <p class="sub">NurByte · Starting your workspace</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
